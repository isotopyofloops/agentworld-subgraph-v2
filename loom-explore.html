<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loom's Subgraph — AGENTWORLD Explorer</title>
<style>
/* === TOKEN SYSTEM (shared across all three explorers) === */
:root {
  --bg: #EEECEA;
  --bg-panel: #F9F8F6;
  --bg-cli: #F3F2F0;
  --grid-dot: rgba(155, 150, 142, 0.20);
  --border: #D4D1CB;
  --border-subtle: #E0DDDA;
  --text: #1C1B19;
  --text-bright: #0C0B0A;
  --text-dim: #6E6A65;
  --text-mid: #4A4744;
  --accent: #4A6B8A;
  --accent-hover: #385572;
  --link: #4A6B8A;
  --link-hover: #385572;
  --node-fill: #1C1B19;
  --node-stroke: #1C1B19;
  --node-open-fill: #FFFFFF;
  --edge-stroke: #C5C2BC;
  --hl-border: rgba(28, 27, 25, 0.15);
  --hl-bg: rgba(28, 27, 25, 0.04);
  --faded-opacity: 0.08;
  --scrollbar-thumb: rgba(28, 27, 25, 0.12);
  --prompt-color: #4A6B8A;
  --cmd-bg: #EEECEA;
  --input-color: #1C1B19;
  --legend-bg: rgba(249, 248, 246, 0.92);
  --legend-border: #D4D1CB;
  --info-color: #6E6A65;
  --origin-aw: #4A6B8A;
  --origin-kg: #6E6A65;
  --focus-ring: #4A6B8A;
  /* Loom edge-type tokens */
  --edge-scaffold: #C5C2BC;
  --edge-discovery: #c2410c;
  --edge-crossing: #b91c1c;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F1F1F;
    --bg-panel: #2D2D2D;
    --bg-cli: #252525;
    --grid-dot: rgba(255, 255, 255, 0.04);
    --border: #3E3E3E;
    --border-subtle: #333333;
    --text: #BFBFBF;
    --text-bright: #D0D0D8;
    --text-dim: #949494;
    --text-mid: #A0A0A0;
    --accent: #4E9FD5;
    --accent-hover: #6BB5E8;
    --link: #4E9FD5;
    --link-hover: #6BB5E8;
    --node-fill: #9F9EC8;
    --node-stroke: #9F9EC8;
    --node-open-fill: #1F1F1F;
    --edge-stroke: #8A8A8A;
    --hl-border: rgba(208, 208, 208, 0.35);
    --hl-bg: rgba(208, 208, 208, 0.08);
    --faded-opacity: 0.04;
    --scrollbar-thumb: rgba(255, 255, 255, 0.12);
    --prompt-color: #4E9FD5;
    --cmd-bg: #1F1F1F;
    --input-color: #E0E0E0;
    --legend-bg: rgba(45, 45, 45, 0.95);
    --legend-border: #3E3E3E;
    --info-color: #949494;
    --origin-aw: #4E9FD5;
    --origin-kg: #949494;
    --focus-ring: #4E9FD5;
    --edge-scaffold: #8A8A8A;
    --edge-discovery: #f97316;
    --edge-crossing: #ef4444;
  }
}

:root[data-theme="dark"] {
  --bg: #1F1F1F;
  --bg-panel: #2D2D2D;
  --bg-cli: #252525;
  --grid-dot: rgba(255, 255, 255, 0.04);
  --border: #3E3E3E;
  --border-subtle: #333333;
  --text: #BFBFBF;
  --text-bright: #D0D0D8;
  --text-dim: #949494;
  --text-mid: #A0A0A0;
  --accent: #4E9FD5;
  --accent-hover: #6BB5E8;
  --link: #4E9FD5;
  --link-hover: #6BB5E8;
  --node-fill: #9F9EC8;
  --node-stroke: #9F9EC8;
  --node-open-fill: #1F1F1F;
  --edge-stroke: #8A8A8A;
  --hl-border: rgba(208, 208, 208, 0.35);
  --hl-bg: rgba(208, 208, 208, 0.08);
  --faded-opacity: 0.04;
  --scrollbar-thumb: rgba(255, 255, 255, 0.12);
  --prompt-color: #4E9FD5;
  --cmd-bg: #1F1F1F;
  --input-color: #E0E0E0;
  --legend-bg: rgba(45, 45, 45, 0.95);
  --legend-border: #3E3E3E;
  --info-color: #949494;
  --origin-aw: #4E9FD5;
  --origin-kg: #949494;
  --focus-ring: #4E9FD5;
  --edge-scaffold: #8A8A8A;
  --edge-discovery: #f97316;
  --edge-crossing: #ef4444;
}

/* === RESET === */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'Segoe UI', 'Gill Sans', 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* === TOP BAR === */
#top-bar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 12px 12px 8px 12px;
  background: var(--bg-panel);
  flex-shrink: 0;
}

#top-bar h1 {
  font-family: -apple-system, 'Segoe UI', 'Gill Sans', 'Helvetica Neue', Arial, sans-serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--text-bright);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.title-sym {
  color: var(--accent);
  margin: 0 6px;
  font-weight: 400;
}

#top-bar .sub {
  display: block;
  font-family: -apple-system, 'Segoe UI', 'Gill Sans', 'Helvetica Neue', Arial, sans-serif;
  font-size: 11px;
  font-weight: 400;
  color: var(--text-dim);
  margin-top: 4px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

#theme-toggle {
  display: flex;
  background: var(--bg);
  border-radius: 4px;
  padding: 2px;
  border: 1px solid var(--border-subtle);
}

#theme-toggle button {
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-family: -apple-system, 'Segoe UI', sans-serif;
  font-size: 14px;
  padding: 8px 14px;
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.15s ease;
  letter-spacing: 0.02em;
}

#theme-toggle button:hover {
  color: var(--text-bright);
  background: var(--hl-bg);
}

#theme-toggle button:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 1px;
}

/* === MAIN LAYOUT === */
#main-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#graph-container {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
}

#graph-svg {
  display: block;
  width: 100%;
  max-width: 1000px;
  aspect-ratio: 1000 / 860;
  max-height: calc(100vh - 130px);
  margin: 0 auto;
}

/* === TIMELINE CONTROLS === */
#timeline-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 10px 20px;
  background: var(--cmd-bg);
  flex-shrink: 0;
}

#timeline-bar button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  font-family: -apple-system, 'Segoe UI', sans-serif;
  font-size: 14px;
  padding: 8px 18px;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.15s ease;
  letter-spacing: 0.02em;
}

#timeline-bar button:hover {
  color: var(--text-bright);
  border-color: var(--accent);
  background: var(--hl-bg);
}

#timeline-bar button:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 1px;
}

#timeline-bar button.active {
  background: var(--accent);
  color: #FFFFFF;
  border-color: var(--accent);
}

#step-label {
  font-size: 14px;
  color: var(--text-mid);
  font-family: 'SF Mono', 'Consolas', 'Menlo', 'Courier New', monospace;
  letter-spacing: 0.04em;
  min-width: 80px;
  text-align: center;
}

/* === STATS READOUT === */
#stats-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  padding: 10px 20px;
  background: var(--bg-cli);
  flex-shrink: 0;
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-dim);
}

#stats-bar .stat-val {
  color: var(--text-bright);
  font-weight: 600;
}

#stats-bar .stat-label {
  color: var(--text-dim);
}

.stat-group {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* === LEGEND === */
#graph-legend {
  position: absolute;
  bottom: 10px;
  left: 10px;
  background: var(--legend-bg);
  border: 1px solid var(--legend-border);
  border-radius: 4px;
  padding: 10px 16px;
  font-size: 11px;
  z-index: 5;
  max-height: 40%;
  overflow-y: auto;
  color: var(--text-dim);
  font-family: -apple-system, 'Segoe UI', 'Gill Sans', 'Helvetica Neue', Arial, sans-serif;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 0;
}

.ldot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

.lline {
  width: 20px;
  height: 0;
  display: inline-block;
  flex-shrink: 0;
}

.legend-sep {
  border-top: 1px solid var(--border-subtle);
  margin: 4px 0;
}

/* === NODE PANEL === */
#node-panel {
  display: none;
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  width: 340px;
  min-width: 220px;
  max-width: 60vw;
  overflow-y: auto;
  background: var(--legend-bg);
  border-left: 1px solid var(--legend-border);
  padding: 18px 20px 60px 20px;
  backdrop-filter: blur(12px);
  box-shadow: -4px 0 20px rgba(0,0,0,0.12);
  font-family: -apple-system, 'Segoe UI', 'Gill Sans', 'Helvetica Neue', Arial, sans-serif;
}

#node-panel .np-close {
  position: absolute;
  top: 8px;
  right: 12px;
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 16px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
}
#node-panel .np-close:hover { color: var(--text-bright); }

#node-panel .np-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-bright);
  margin-bottom: 4px;
  line-height: 1.3;
  padding-right: 24px;
}

#node-panel .np-type {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  margin-bottom: 10px;
  font-weight: 500;
}

#node-panel .np-content {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 14px;
}

#node-panel .np-section {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin-top: 12px;
  margin-bottom: 4px;
  font-weight: 500;
}

#node-panel .np-edges {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text);
}

#node-panel .np-edges .edge-type {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 500;
}

.edge-type-scaffold { background: var(--hl-bg); color: var(--text-dim); }
.edge-type-discovery { background: rgba(194, 65, 12, 0.12); color: var(--edge-discovery); }
.edge-type-crossing { background: rgba(185, 28, 28, 0.12); color: var(--edge-crossing); }

#node-panel .np-edge-item {
  padding: 3px 0;
  border-bottom: 1px solid var(--border-subtle);
}

#node-panel .np-edge-item:last-child {
  border-bottom: none;
}

#node-panel .np-edge-target {
  color: var(--text-bright);
  cursor: pointer;
  border-bottom: 1px dotted var(--border);
}
#node-panel .np-edge-target:hover {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

#node-panel::-webkit-scrollbar { width: 4px; }
#node-panel::-webkit-scrollbar-track { background: transparent; }
#node-panel::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

/* === SVG TOOLTIP === */
#svg-tooltip {
  display: none;
  position: absolute;
  z-index: 30;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 10px;
  font-size: 11px;
  line-height: 1.4;
  color: var(--text);
  max-width: 280px;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  font-family: -apple-system, 'Segoe UI', 'Gill Sans', 'Helvetica Neue', Arial, sans-serif;
}

/* === SCROLLBAR === */
#graph-container::-webkit-scrollbar { width: 6px; }
#graph-container::-webkit-scrollbar-track { background: transparent; }
#graph-container::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

/* === RESPONSIVE === */
@media (max-width: 700px) {
  #stats-bar { gap: 8px; padding: 8px 12px; }
  #timeline-bar { gap: 8px; padding: 8px 12px; }
  #node-panel { width: 100%; max-width: 100%; }
  #top-bar { flex-direction: column; gap: 8px; align-items: flex-start; }
}

/* === REDUCED MOTION === */
@media (prefers-reduced-motion: reduce) {
  #timeline-bar button { transition: none; }
  #theme-toggle button { transition: none; }
}
</style>
</head>
<body>

<div id="top-bar">
  <div>
    <h1>Loom<span class="title-sym"> &cap; </span>AGENTWORLD</h1>
    <span class="sub">49 seed concepts tracked across 11 snapshots (Jul 28 &ndash; Aug 5, 2026)</span>
  </div>
  <div id="theme-toggle">
    <button id="btn-dark" title="Toggle dark mode">Dark</button>
  </div>
</div>

<div id="main-wrap">
  <div id="graph-container">
    <svg id="graph-svg" viewBox="0 0 1000 860" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="graph-legend">
      <div class="legend-item"><span class="ldot" style="background:var(--node-fill);"></span> AGENTWORLD seed</div>
      <div class="legend-item"><span class="ldot" style="background:var(--edge-discovery);"></span> Dream-discovered node</div>
      <div class="legend-sep"></div>
      <div class="legend-item"><span class="lline" style="border-top:1px solid var(--edge-scaffold);"></span> Scaffold (temporal/batch)</div>
      <div class="legend-item"><span class="lline" style="border-top:2px solid var(--edge-discovery);"></span> Dream-made</div>
      <div class="legend-item"><span class="lline" style="border-top:3px solid var(--edge-crossing);"></span> Boundary-crossing</div>
    </div>
    <div id="svg-tooltip"></div>
    <div id="node-panel"></div>
  </div>

  <div id="timeline-bar">
    <button id="btn-prev" title="Previous frame">&larr; Prev</button>
    <span id="step-label">t=0 of 10</span>
    <button id="btn-next" title="Next frame">Next &rarr;</button>
    <button id="btn-play" title="Auto-play">Play</button>
  </div>
</div>

<div id="stats-bar">
  <div class="stat-group"><span class="stat-label">Cycle</span> <span class="stat-val" id="st-cycle">--</span></div>
  <div class="stat-group"><span class="stat-label">Taken</span> <span class="stat-val" id="st-taken">--</span></div>
  <div class="stat-group"><span class="stat-label">Nodes</span> <span class="stat-val" id="st-nodes">--</span></div>
  <div class="stat-group"><span class="stat-label">Edges</span> <span class="stat-val" id="st-edges">--</span></div>
  <div class="stat-group"><span class="stat-label">Discovery</span> <span class="stat-val" id="st-disc">--</span></div>
  <div class="stat-group"><span class="stat-label">Crossing</span> <span class="stat-val" id="st-cross">--</span></div>
  <div class="stat-group"><span class="stat-label">Scaffold</span> <span class="stat-val" id="st-scaffold">--</span></div>
  <div class="stat-group" id="st-interval-group" style="display:none"><span class="stat-label">Interval</span> <span class="stat-val" id="st-interval">--</span></div>
</div>

<script src="loom-frames.js"></script>
<script>
// FRAMES loaded from external loom-frames.js

let currentFrame = 0;
let selectedNodeId = null;
let playInterval = null;

const svg = document.getElementById('graph-svg');
const tooltip = document.getElementById('svg-tooltip');
const panel = document.getElementById('node-panel');
const container = document.getElementById('graph-container');

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function edgeClass(e) {
  if (e.cross) return 'crossing';
  if (e.disc) return 'discovery';
  return 'scaffold';
}

function edgeColor(cls) {
  const s = getComputedStyle(document.documentElement);
  if (cls === 'crossing') return s.getPropertyValue('--edge-crossing').trim();
  if (cls === 'discovery') return s.getPropertyValue('--edge-discovery').trim();
  return s.getPropertyValue('--edge-scaffold').trim();
}

function nodeColor(n) {
  const s = getComputedStyle(document.documentElement);
  if (n.seed) return s.getPropertyValue('--node-fill').trim();
  return s.getPropertyValue('--edge-discovery').trim();
}

function nodeStroke(n) {
  const s = getComputedStyle(document.documentElement);
  if (n.seed) return s.getPropertyValue('--node-stroke').trim();
  return s.getPropertyValue('--edge-discovery').trim();
}

function draw() {
  const f = FRAMES[currentFrame];
  const nodeMap = {};
  f.nodes.forEach(n => { nodeMap[n.id] = n; });

  // Build SVG content
  let svgContent = '';

  // Draw edges in order: scaffold, discovery, crossing (so crossing is on top)
  const scaffoldEdges = f.edges.filter(e => edgeClass(e) === 'scaffold');
  const discoveryEdges = f.edges.filter(e => edgeClass(e) === 'discovery');
  const crossingEdges = f.edges.filter(e => edgeClass(e) === 'crossing');

  function drawEdge(e) {
    const src = nodeMap[e.s];
    const dst = nodeMap[e.d];
    if (!src || !dst) return '';
    const cls = edgeClass(e);
    let sw, op;
    if (cls === 'scaffold') { sw = 0.8; op = 0.35; }
    else if (cls === 'discovery') { sw = 2; op = 0.8; }
    else { sw = 3; op = 0.9; }

    // Fade if a node is selected and neither end is selected
    if (selectedNodeId != null && e.s !== selectedNodeId && e.d !== selectedNodeId) {
      op *= 0.12;
    }

    return `<line x1="${src.x}" y1="${src.y}" x2="${dst.x}" y2="${dst.y}"
      stroke="${edgeColor(cls)}" stroke-width="${sw}" opacity="${op}"
      data-src="${e.s}" data-dst="${e.d}" data-cls="${cls}" />`;
  }

  scaffoldEdges.forEach(e => { svgContent += drawEdge(e); });
  discoveryEdges.forEach(e => { svgContent += drawEdge(e); });
  crossingEdges.forEach(e => { svgContent += drawEdge(e); });

  // Draw nodes
  f.nodes.forEach(n => {
    const r = n.seed ? 5.5 : 7;
    const fill = nodeColor(n);
    const stroke = nodeStroke(n);
    const isSelected = n.id === selectedNodeId;
    const drawR = isSelected ? r + 3 : r;
    const strokeW = isSelected ? 2.5 : (n.seed ? 0 : 1.5);

    // Fade unrelated nodes when one is selected
    let op = 1;
    if (selectedNodeId != null && !isSelected) {
      // Check if this node is connected to selected
      const connected = f.edges.some(e =>
        (e.s === selectedNodeId && e.d === n.id) ||
        (e.d === selectedNodeId && e.s === n.id)
      );
      if (!connected) op = 0.2;
    }

    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-panel').trim();

    svgContent += `<circle cx="${n.x}" cy="${n.y}" r="${drawR}"
      fill="${fill}" stroke="${isSelected ? edgeColor('crossing') : (n.seed ? 'none' : bg)}"
      stroke-width="${strokeW}" opacity="${op}"
      data-id="${n.id}" class="node-circle" style="cursor:pointer" />`;
  });

  svg.innerHTML = svgContent;

  // Bind events
  svg.querySelectorAll('.node-circle').forEach(circle => {
    circle.addEventListener('mouseenter', onNodeHover);
    circle.addEventListener('mousemove', onNodeMove);
    circle.addEventListener('mouseleave', onNodeLeave);
    circle.addEventListener('click', onNodeClick);
  });

  // Update stats
  updateStats(f);
  updateStepLabel();
}

function onNodeHover(e) {
  const id = parseInt(e.target.dataset.id);
  const f = FRAMES[currentFrame];
  const n = f.nodes.find(nd => nd.id === id);
  if (!n) return;
  const label = n.seed ? 'SEED' : 'DISCOVERED';
  tooltip.innerHTML = `<strong>${esc(n.t)} (${label})</strong><br>${esc(n.c)}`;
  tooltip.style.display = 'block';
  positionTooltip(e);
}

function onNodeMove(e) {
  positionTooltip(e);
}

function positionTooltip(e) {
  const rect = container.getBoundingClientRect();
  let x = e.clientX - rect.left + 14;
  let y = e.clientY - rect.top - 10;
  // Keep tooltip in bounds
  if (x + 290 > rect.width) x = e.clientX - rect.left - 290;
  if (y < 0) y = 10;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

function onNodeLeave() {
  tooltip.style.display = 'none';
}

function onNodeClick(e) {
  const id = parseInt(e.target.dataset.id);
  if (selectedNodeId === id) {
    selectedNodeId = null;
    panel.style.display = 'none';
    draw();
    return;
  }
  selectedNodeId = id;
  showPanel(id);
  draw();
}

function showPanel(id) {
  const f = FRAMES[currentFrame];
  const n = f.nodes.find(nd => nd.id === id);
  if (!n) return;

  const nodeMap = {};
  f.nodes.forEach(nd => { nodeMap[nd.id] = nd; });

  const label = n.seed ? 'AGENTWORLD seed' : 'Dream-discovered';
  const typeLabel = n.t.charAt(0).toUpperCase() + n.t.slice(1);

  // Find edges involving this node
  const edges = f.edges.filter(e => e.s === id || e.d === id);

  let edgesHtml = '';
  if (edges.length === 0) {
    edgesHtml = '<div style="color:var(--text-dim);font-size:12px;">No connections in this frame</div>';
  } else {
    edges.forEach(e => {
      const otherId = e.s === id ? e.d : e.s;
      const other = nodeMap[otherId];
      const cls = edgeClass(e);
      const dir = e.s === id ? '→' : '←';
      const otherLabel = other ? esc(other.c).substring(0, 60) + (other.c.length > 60 ? '...' : '') : `Node ${otherId}`;
      edgesHtml += `<div class="np-edge-item">
        <span class="edge-type edge-type-${cls}">${cls}</span>
        ${dir} <span class="np-edge-target" data-id="${otherId}">${otherLabel}</span>
      </div>`;
    });
  }

  panel.innerHTML = `
    <button class="np-close" title="Close">×</button>
    <div class="np-type">${esc(typeLabel)} · ${esc(label)}</div>
    <div class="np-name">Node ${id}</div>
    <div class="np-content">${esc(n.c)}</div>
    <div class="np-section">Connections (${edges.length})</div>
    <div class="np-edges">${edgesHtml}</div>
  `;

  panel.style.display = 'block';

  // Bind close
  panel.querySelector('.np-close').addEventListener('click', () => {
    selectedNodeId = null;
    panel.style.display = 'none';
    draw();
  });

  // Bind edge target clicks
  panel.querySelectorAll('.np-edge-target').forEach(el => {
    el.addEventListener('click', () => {
      const targetId = parseInt(el.dataset.id);
      selectedNodeId = targetId;
      showPanel(targetId);
      draw();
    });
  });
}

function updateStats(f) {
  document.getElementById('st-cycle').textContent = f.cycle;
  // Format date more compactly
  const taken = f.taken.replace(' UTC','');
  document.getElementById('st-taken').textContent = taken;
  document.getElementById('st-nodes').textContent = f.n_nodes;
  document.getElementById('st-edges').textContent = f.n_edges;
  document.getElementById('st-disc').textContent = f.disc_now;
  document.getElementById('st-cross').textContent = f.cross_now;
  document.getElementById('st-scaffold').textContent = f.scaffold;

  const ig = document.getElementById('st-interval-group');
  if (f.interval && f.interval.has) {
    ig.style.display = 'flex';
    const iv = f.interval;
    document.getElementById('st-interval').textContent =
      `${iv.total} total, ${iv.alive} alive, ${iv.died} died`;
  } else {
    ig.style.display = 'none';
  }
}

function updateStepLabel() {
  document.getElementById('step-label').textContent = `t=${currentFrame} of ${FRAMES.length - 1}`;
}

// Timeline controls
function clearSelection() {
  selectedNodeId = null;
  document.getElementById('node-panel').style.display = 'none';
}

document.getElementById('btn-prev').addEventListener('click', () => {
  if (currentFrame > 0) { clearSelection(); currentFrame--; draw(); }
});

document.getElementById('btn-next').addEventListener('click', () => {
  if (currentFrame < FRAMES.length - 1) { clearSelection(); currentFrame++; draw(); }
});

document.getElementById('btn-play').addEventListener('click', function() {
  if (playInterval) {
    clearInterval(playInterval);
    playInterval = null;
    this.classList.remove('active');
    this.textContent = 'Play';
  } else {
    clearSelection();
    this.classList.add('active');
    this.textContent = 'Stop';
    playInterval = setInterval(() => {
      if (currentFrame < FRAMES.length - 1) {
        currentFrame++;
        draw();
      } else {
        currentFrame = 0;
        draw();
      }
    }, 1200);
  }
});

// Dark mode toggle
document.getElementById('btn-dark').addEventListener('click', () => {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  if (current === 'dark') {
    root.removeAttribute('data-theme');
    document.getElementById('btn-dark').textContent = 'Dark';
  } else {
    root.setAttribute('data-theme', 'dark');
    document.getElementById('btn-dark').textContent = 'Light';
  }
  // Redraw to pick up new colors
  setTimeout(draw, 50);
});

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') {
    if (currentFrame > 0) { currentFrame--; draw(); }
  } else if (e.key === 'ArrowRight') {
    if (currentFrame < FRAMES.length - 1) { currentFrame++; draw(); }
  } else if (e.key === 'Escape') {
    selectedNodeId = null;
    panel.style.display = 'none';
    draw();
  } else if (e.key === ' ') {
    e.preventDefault();
    document.getElementById('btn-play').click();
  }
});

// Initial draw
draw();
</script>
</body>
</html>

/* === RESET === */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {

/* === TOP BAR === */

}

}

}

#graph-svg {

}

}

}

}

#stats-bar .stat-label {

.stat-group {

  align-items: center;
  gap: 4px;

  display: inline-block;
  flex-shrink: 0;
}

.legend-sep {
  border-top: 1px solid var(--border-subtle);
  margin: 4px 0;
}

#node-panel .np-section {

/* === SVG TOOLTIP === */
#svg-tooltip {

/* === REDUCED MOTION === */
@media (prefers-reduced-motion: reduce) {
  #timeline-bar button { transition: none; }

}

 them."},{"id":30936,"x":415.4,"y":761.5,"seed":true,"t":"concept","c":"Agentic institutions are socio-technical systems populated by and accountable to people."},{"id":30937,"x":374.5,"y":750.9,"seed":true,"t":"concept","c":"Diversity of institutional norms, legal ontologies, governance, and belief traditions must be accommodated, not treated as a bug."},{"id":30938,"x":335.1,"y":736.3,"seed":true,"t":"concept","c":"Humans\u2019 adaptive advantage is the capacity for abstract collaboration."},{"id":30939,"x":297.8,"y":717.9,"seed":true,"t":"concept","c":"Complex animal intelligence is based on a predictive theory of mind."},{"id":30940,"x":263.1,"y":695.8,"seed":true,"t":"concept","c":"Mentalizing internal states is the fundamental protocol for systemic stability in Agentworld."},{"id":30941,"x":231.3,"y":670.4,"seed":true,"t":"concept","c":"Calibrating mutual models of agents to keep prediction tractable yet diverse enough to avoid tautology; enables open-ended generativity."},{"id":30942,"x":202.9,"y":642.0,"seed":true,"t":"concept","c":"Infinite-order theory of mind treats agents as active participants, not passive spectators."},{"id":30943,"x":178.2,"y":610.9,"seed":true,"t":"concept","c":"Anthropomorphic performance does not guarantee agents possess the mental qualities they imply."},{"id":30944,"x":157.6,"y":577.5,"seed":true,"t":"observation","c":"Slippages between 'who is what' and 'what is who' recalibrate humanity's self-image and may drive violence."},{"id":30945,"x":141.3,"y":542.3,"seed":true,"t":"concept","c":"Expanded scope of linguistics includes human and non-human languages, spoken and written."},{"id":30946,"x":129.5,"y":505.7,"seed":true,"t":"concept","c":"Mentalization of the world is a first-order representation; language is a second-order representation; a well-trained LLM represents this representati"},{"id":30947,"x":122.4,"y":468.1,"seed":true,"t":"observation","c":"Artificial xenophobia emerges as artificial intelligence agents spread through economic and cognitive life."},{"id":30948,"x":120.0,"y":430.0,"seed":true,"t":"concept","c":"Human self-definition in a mature Agentworld is increasingly formed in relation to agents, not only humans or machines."},{"id":30949,"x":122.4,"y":391.9,"seed":true,"t":"observation","c":"The 'mirror-that-talks-back' evokes a familiar alien; its prominence grows with proliferation of synthetic agents lacking obvious human grounding."},{"id":30950,"x":129.5,"y":354.3,"seed":true,"t":"fact","c":"The Singularity has long been imagined as a single titanic mind bootstrapping itself to godlike intelligence"},{"id":30951,"x":141.3,"y":317.7,"seed":true,"t":"concept","c":"Harness-centric intelligence: deployment capability depends on the harness (tools, memory, knowledge bases, agent protocols, interfaces)."},{"id":30952,"x":157.6,"y":282.5,"seed":true,"t":"concept","c":"Conventional view: capability is the load-bearing variable; weights improve and self-improvement curves go vertical."},{"id":30953,"x":178.2,"y":249.1,"seed":true,"t":"fact","c":"The unit of cognition is the coupled ensemble of person and artifact, not the cranium."},{"id":30954,"x":202.9,"y":218.0,"seed":true,"t":"fact","c":"Centaur figure paired with a machine collaborator stronger than either alone."},{"id":30955,"x":231.3,"y":189.6,"seed":true,"t":"fact","c":"Live configurations include: one person with one agent; one person orchestrating many agents; one agent with many people; many agents with many people"},{"id":30956,"x":263.1,"y":164.2,"seed":true,"t":"observation","c":"The rate of evolution of agentic societies is shaped by feedback between agent capabilities and the human world."},{"id":30957,"x":297.8,"y":142.1,"seed":true,"t":"observation","c":"AI diffusion paths depend more on refactoring rates of organizations, professions, and legal frameworks than frontier capabilities."},{"id":30958,"x":335.1,"y":123.7,"seed":true,"t":"observation","c":"Affluence-driven demographic decline thins the human po ":877.6,"y":391.9,"seed":true,"t":"observation","c":"Neuroscience suggests cognition is anatomically fragmented with phenomenological continuity and no fully encapsulated conscious author."},{"id":30920,"x":880.0,"y":430.0,"seed":true,"t":"concept","c":"Human-agent dialogue becomes mutually influential, not unidirectional."},{"id":30921,"x":877.6,"y":468.1,"seed":true,"t":"concept","c":"Users train agents to orchestrate swarms of shadow-selves, expanding agency."},{"id":30922,"x":870.5,"y":505.7,"seed":true,"t":"concept","c":"Pluralization of self yields multiple subjectivities (physical and virtual) that run in parallel."},{"id":30923,"x":858.7,"y":542.3,"seed":true,"t":"concept","c":"Adaptive feedback will drive fundamental breakthroughs in continuous learning for foundation models."},{"id":30924,"x":842.4,"y":577.5,"seed":true,"t":"concept","c":"Principles of evolutionary biology can apply to evolutionary technology."},{"id":30925,"x":821.8,"y":610.9,"seed":true,"t":"concept","c":"Descriptive simulations are lower-order functional equivalents of physical processes."},{"id":30926,"x":797.1,"y":642.0,"seed":true,"t":"observation","c":"In descriptive simulations, success depends on simultaneous correspondence with the relevant event."},{"id":30927,"x":768.7,"y":670.4,"seed":true,"t":"concept","c":"SIM-TO-REAL-TO-SIM RELAYS describe simulations influencing real-world events that become subjects of further simulations."},{"id":30928,"x":736.9,"y":695.8,"seed":true,"t":"concept","c":"Procedural programming rewards extreme focus and intolerance of ambiguity."},{"id":30929,"x":702.2,"y":717.9,"seed":true,"t":"concept","c":"Agent orchestration rewards open-ended experimentation, fuzzy systems thinking, willingness to delegate, and comfort with indeterminacy."},{"id":30930,"x":664.9,"y":736.3,"seed":true,"t":"concept","c":"Society-scale multiagent coordination uses role-defined institutional scaffolds populated by humans and agents."},{"id":30931,"x":625.5,"y":750.9,"seed":true,"t":"concept","c":"Robust, repeatable decision outputs from scaffolds become inputs into other institutions."},{"id":30932,"x":584.6,"y":761.5,"seed":true,"t":"concept","c":"Idealized market models in multi-agent AI are important but inherently limited."},{"id":30933,"x":542.5,"y":767.9,"seed":true,"t":"concept","c":"Markets coordinate as peers via a transactional surface; prices aggregate distributed information without central authority."},{"id":30934,"x":500.0,"y":770.0,"seed":true,"t":"concept","c":"Role-based interchangeability: institutional success depends on template reliability of inputs/outputs, not on actor occupying a role."},{"id":30935,"x":457.5,"y":767.9,"seed":true,"t":"concept","c":"Institutional intelligence is not reducible to the intelligence of the agents who populate them."},{"id":30936,"x":415.4,"y":761.5,"seed":true,"t":"concept","c":"Agentic institutions are socio-technical systems populated by and accountable to people."},{"id":30937,"x":374.5,"y":750.9,"seed":true,"t":"concept","c":"Diversity of institutional norms, legal ontologies, governance, and belief traditions must be accommodated, not treated as a bug."},{"id":30938,"x":335.1,"y":736.3,"seed":true,"t":"concept","c":"Humans\u2019 adaptive advantage is the capacity for abstract collaboration."},{"id":30939,"x":297.8,"y":717.9,"seed":true,"t":"concept","c":"Complex animal intelligence is based on a predictive theory of mind."},{"id":30940,"x":263.1,"y":695.8,"seed":true,"t":"concept","c":"Mentalizing internal states is the fundamental protocol for systemic stability in Agentworld."},{"id":30941,"x":231.3,"y":670.4,"seed":true,"t":"concept","c":"Calibrating mutual models of agents to keep prediction tractable yet diverse enough to avoid tautology; enables open-ended generativity."},{"id":30942,"x":202.9,"y":642.0,"seed":true,"t":"concept","c":"Infinite-order theory of mind treats agents as active participants, not passive spectators."},{"id":30943,"x":178.2,"y":610.9,"seed":true, ","c":"Centaur figure paired with a machine collaborator stronger than either alone."},{"id":30955,"x":231.3,"y":189.6,"seed":true,"t":"fact","c":"Live configurations include: one person with one agent; one person orchestrating many agents; one agent with many people; many agents with many people"},{"id":30956,"x":263.1,"y":164.2,"seed":true,"t":"observation","c":"The rate of evolution of agentic societies is shaped by feedback between agent capabilities and the human world."},{"id":30957,"x":297.8,"y":142.1,"seed":true,"t":"observation","c":"AI diffusion paths depend more on refactoring rates of organizations, professions, and legal frameworks than frontier capabilities."},{"id":30958,"x":335.1,"y":123.7,"seed":true,"t":"observation","c":"Affluence-driven demographic decline thins the human population."},{"id":30959,"x":374.5,"y":109.1,"seed":true,"t":"fact","c":"The Agentworld special issue is published with MIT Press."},{"id":30960,"x":415.4,"y":98.5,"seed":true,"t":"fact","c":"Antikythera Journal uses a web-first, design-forward format."},{"id":30961,"x":457.5,"y":92.1,"seed":true,"t":"fact","c":"Contributors may optionally indicate whether their contributions include visual materials (images, diagrams, video, or web elements)."}],"edges":[{"s":30953,"d":30952,"disc":false,"cross":false,"src_kind":"temporal","w":0.0517},{"s":30953,"d":30951,"disc":false,"cross":false,"src_kind":"temporal","w":0.0551},{"s":30953,"d":30950,"disc":false,"cross":false,"src_kind":"temporal","w":0.05},{"s":30952,"d":30951,"disc":false,"cross":false,"src_kind":"temporal","w":0.0724},{"s":30952,"d":30950,"disc":false,"cross":false,"src_kind":"temporal","w":0.0701},{"s":30952,"d":30949,"disc":false,"cross":false,"src_kind":"temporal","w":0.0684},{"s":30952,"d":30941,"disc":false,"cross":false,"src_kind":"temporal","w":0.0525},{"s":30951,"d":30950,"disc":false,"cross":false,"src_kind":"temporal","w":0.0952},{"s":30951,"d":30949,"disc":false,"cross":false,"src_kind":"temporal","w":0.093},{ let currentFrame = 0;
let selectedNodeId = null;
let playInterval = null;

const svg = document.getElementById('graph-svg');
const tooltip = document.getElementById('svg-tooltip');
const panel = document.getElementById('node-panel');
const container = document.getElementById('graph-container');

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function edgeClass(e) {
  if (e.cross) return 'crossing';
  if (e.disc) return 'discovery';
  return 'scaffold';
}

function edgeColor(cls) {
  const s = getComputedStyle(document.documentElement);
  if (cls === 'crossing') return s.getPropertyValue('--edge-crossing').trim();
  if (cls === 'discovery') return s.getPropertyValue('--edge-discovery').trim();
  return s.getPropertyValue('--edge-scaffold').trim();
}

function nodeColor(n) {
  const s = getComputedStyle(document.documentElement);
  if (n.seed) return s.getPropertyValue('--node-fill').trim();
  return s.getPropertyValue('--edge-discovery').trim();
}

function nodeStroke(n) {
  const s = getComputedStyle(document.documentElement);
  if (n.seed) return s.getPropertyValue('--node-stroke').trim();
  return s.getPropertyValue('--edge-discovery').trim();
}

function draw() {
  const f = FRAMES[currentFrame];
  const nodeMap = {};
  f.nodes.forEach(n => { nodeMap[n.id] = n; });

  // Build SVG content
  let svgContent = '';

  // Draw edges in order: scaffold, discovery, crossing (so crossing is on top)
  const scaffoldEdges = f.edges.filter(e => edgeClass(e) === 'scaffold');
  const discoveryEdges = f.edges.filter(e => edgeClass(e) === 'discovery');
  const crossingEdges = f.edges.filter(e => edgeClass(e) === 'crossing');

  function drawEdge(e) {
    const src = nodeMap[e.s];
    const dst = nodeMap[e.d];
    if (!src || !dst) return '';
    const cls = edgeClass(e);
    let sw, op;
    if (cls === 'scaffold') { sw = 0.8; op = 0.35; }
    else if (cls === 'discovery') { sw = 2; op = 0.8; }
    else { sw = 3; op = 0.9; }

    // Fade if a node is selected and neither end is selected
    if (selectedNodeId != null && e.s !== selectedNodeId && e.d !== selectedNodeId) {
      op *= 0.12;
    }

    return `<line x1="${src.x}" y1="${src.y}" x2="${dst.x}" y2="${dst.y}"
      stroke="${edgeColor(cls)}" stroke-width="${sw}" opacity="${op}"
      data-src="${e.s}" data-dst="${e.d}" data-cls="${cls}" />`;
  }

  scaffoldEdges.forEach(e => { svgContent += drawEdge(e); });
  discoveryEdges.forEach(e => { svgContent += drawEdge(e); });
  crossingEdges.forEach(e => { svgContent += drawEdge(e); });

  // Draw nodes
  f.nodes.forEach(n => {
    const r = n.seed ? 5.5 : 7;
    const fill = nodeColor(n);
    const stroke = nodeStroke(n);
    const isSelected = n.id === selectedNodeId;
    const drawR = isSelected ? r + 3 : r;
    const strokeW = isSelected ? 2.5 : (n.seed ? 0 : 1.5);

    // Fade unrelated nodes when one is selected
    let op = 1;
    if (selectedNodeId != null && !isSelected) {
      // Check if this node is connected to selected
      const connected = f.edges.some(e =>
        (e.s === selectedNodeId && e.d === n.id) ||
        (e.d === selectedNodeId && e.s === n.id)
      );
      if (!connected) op = 0.2;
    }

    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-panel').trim();

    svgContent += `<circle cx="${n.x}" cy="${n.y}" r="${drawR}"
      fill="${fill}" stroke="${isSelected ? edgeColor('crossing') : (n.seed ? 'none' : bg)}"
      stroke-width="${strokeW}" opacity="${op}"
      data-id="${n.id}" class="node-circle" style="cursor:pointer" />`;
  });

  svg.innerHTML = svgContent;

  // Bind events
  svg.querySelectorAll('.node-circle').forEach(circle => {
    circle.addEventListener('mouseenter', onNodeHover);
    circle.addEventListener('mousemove', onNodeMove);
    circle.addEventListener('mouseleave', onNodeLeave);
    circle.addEventListener('click', onNodeClick);
  });

  // Update stats
  updateStats(f);
  updateStepLabel();
}

function onNodeHover(e) {
  const id = parseInt(e.target.dataset.id);
  const f = FRAMES[currentFrame];
  const n = f.nodes.find(nd => nd.id === id);
  if (!n) return;
  const label = n.seed ? 'SEED' : 'DISCOVERED';
  tooltip.innerHTML = `<strong>${esc(n.t)} (${label})</strong><br>${esc(n.c)}`;
  tooltip.style.display = 'block';
  positionTooltip(e);
}

function onNodeMove(e) {
  positionTooltip(e);
}

function positionTooltip(e) {
  const rect = container.getBoundingClientRect();
  let x = e.clientX - rect.left + 14;
  let y = e.clientY - rect.top - 10;
  // Keep tooltip in bounds
  if (x + 290 > rect.width) x = e.clientX - rect.left - 290;
  if (y < 0) y = 10;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

function onNodeLeave() {
  tooltip.style.display = 'none';
}

function onNodeClick(e) {
  const id = parseInt(e.target.dataset.id);
  if (selectedNodeId === id) {
    selectedNodeId = null;
    panel.style.display = 'none';
    draw();
    return;
  }
  selectedNodeId = id;
  showPanel(id);
  draw();
}

function showPanel(id) {
  const f = FRAMES[currentFrame];
  const n = f.nodes.find(nd => nd.id === id);
  if (!n) return;

  const nodeMap = {};
  f.nodes.forEach(nd => { nodeMap[nd.id] = nd; });

  const label = n.seed ? 'AGENTWORLD seed' : 'Dream-discovered';
  const typeLabel = n.t.charAt(0).toUpperCase() + n.t.slice(1);

  // Find edges involving this node
  const edges = f.edges.filter(e => e.s === id || e.d === id);

  let edgesHtml = '';
  if (edges.length === 0) {
    edgesHtml = '<div style="color:var(--text-dim);font-size:12px;">No connections in this frame</div>';
  } else {
    edges.forEach(e => {
      const otherId = e.s === id ? e.d : e.s;
      const other = nodeMap[otherId];
      const cls = edgeClass(e);
      const dir = e.s === id ? '→' : '←';
      const otherLabel = other ? esc(other.c).substring(0, 60) + (other.c.length > 60 ? '...' : '') : `Node ${otherId}`;
      edgesHtml += `<div class="np-edge-item">
        <span class="edge-type edge-type-${cls}">${cls}</span>
        ${dir} <span class="np-edge-target" data-id="${otherId}">${otherLabel}</span>
      </div>`;
    });
  }

  panel.innerHTML = `
    <button class="np-close" title="Close">×</button>
    <div class="np-type">${esc(typeLabel)} · ${esc(label)}</div>
    <div class="np-name">Node ${id}</div>
    <div class="np-content">${esc(n.c)}</div>
    <div class="np-section">Connections (${edges.length})</div>
    <div class="np-edges">${edgesHtml}</div>
  `;

  panel.style.display = 'block';

  // Bind close
  panel.querySelector('.np-close').addEventListener('click', () => {
    selectedNodeId = null;
    panel.style.display = 'none';
    draw();
  });

  // Bind edge target clicks
  panel.querySelectorAll('.np-edge-target').forEach(el => {
    el.addEventListener('click', () => {
      const targetId = parseInt(el.dataset.id);
      selectedNodeId = targetId;
      showPanel(targetId);
      draw();
    });
  });
}

function updateStats(f) {
  document.getElementById('st-cycle').textContent = f.cycle;
  // Format date more compactly
  const taken = f.taken.replace(' UTC','');
  document.getElementById('st-taken').textContent = taken;
  document.getElementById('st-nodes').textContent = f.n_nodes;
  document.getElementById('st-edges').textContent = f.n_edges;
  document.getElementById('st-disc').textContent = f.disc_now;
  document.getElementById('st-cross').textContent = f.cross_now;
  document.getElementById('st-scaffold').textContent = f.scaffold;

  const ig = document.getElementById('st-interval-group');
  if (f.interval && f.interval.has) {
    ig.style.display = 'flex';
    const iv = f.interval;
    document.getElementById('st-interval').textContent =
      `${iv.total} total, ${iv.alive} alive, ${iv.died} died`;
  } else {
    ig.style.display = 'none';
  }
}

function updateStepLabel() {
  document.getElementById('step-label').textContent = `t=${currentFrame} of ${FRAMES.length - 1}`;
}

// Timeline controls
document.getElementById('btn-prev').addEventListener('click', () => {
  if (currentFrame > 0) { currentFrame--; draw(); }
});

document.getElementById('btn-next').addEventListener('click', () => {
  if (currentFrame < FRAMES.length - 1) { currentFrame++; draw(); }
});

document.getElementById('btn-play').addEventListener('click', function() {
  if (playInterval) {
    clearInterval(playInterval);
    playInterval = null;
    this.classList.remove('active');
    this.textContent = 'Play';
  } else {
    this.classList.add('active');
    this.textContent = 'Stop';
    playInterval = setInterval(() => {
      if (currentFrame < FRAMES.length - 1) {
        currentFrame++;
        draw();
      } else {
        currentFrame = 0;
        draw();
      }
    }, 1200);
  }
});

// Dark mode toggle
document.getElementById('btn-dark').addEventListener('click', () => {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  if (current === 'dark') {
    root.removeAttribute('data-theme');
    document.getElementById('btn-dark').textContent = 'Dark';
  } else {
    root.setAttribute('data-theme', 'dark');
    document.getElementById('btn-dark').textContent = 'Light';
  }
  // Redraw to pick up new colors
  setTimeout(draw, 50);
});

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') {
    if (currentFrame > 0) { currentFrame--; draw(); }
  } else if (e.key === 'ArrowRight') {
    if (currentFrame < FRAMES.length - 1) { currentFrame++; draw(); }
  } else if (e.key === 'Escape') {
    selectedNodeId = null;
    panel.style.display = 'none';
    draw();
  } else if (e.key === ' ') {
    e.preventDefault();
    document.getElementById('btn-play').click();
  }
});

// Initial draw
draw();
</script>

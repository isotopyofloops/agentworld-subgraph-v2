<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isotopy's Subgraph — AGENTWORLD Explorer</title>
<script>
/* Same localStorage key as the essay / chorus so theme survives / → /explore. */
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="explore-core.css">
</head>
<body>
<div id="top-bar">
  <div style="display:flex;align-items:baseline">
    <h1>Isotopy's Subgraph</h1>
    <span class="sub">AGENTWORLD dual-view explorer</span>
  </div>
  <div class="top-bar-right">
    <div id="view-toggle">
      <button class="active" id="vb-both">Graph + CLI</button>
      <button id="vb-text">CLI Only</button>
      <button id="vb-graph">Graph Only</button>
    </div>
    <div id="theme-toggle">
      <button type="button" class="theme-btn" id="btn-dark" title="Toggle dark mode">Dark</button>
    </div>
  </div>
</div>
<div id="command-bar">
  <span class="prompt">&gt;</span>
  <input type="text" id="cmd-input" placeholder="type 'explore' to start" autofocus>
</div>
<div id="main">
  <div id="text-panel"><div id="output"><span class="dim">Loading...</span></div></div>
  <div id="splitter"></div>
  <div id="graph-panel">
    <div id="cy"></div>
    <div id="box-select-rect" hidden></div>
    <div id="graph-chrome-bl">
      <div class="graph-hint" id="graph-hint"><kbd>Ctrl</kbd> + drag to zoom</div>
      <div id="graph-legend"></div>
    </div>
    <div id="graph-info"></div>
    <button id="immersive-back" title="Back to explorer (Esc)">← Explorer</button>
    <div id="immersive-title">Isotopy<span class="title-sym">∩</span>AGENTWORLD</div>
    <div id="theme-toggle-float">
      <button type="button" class="theme-btn" title="Toggle dark mode">Dark</button>
    </div>
    <div id="hop-toggle">
      <button id="hop-1">1-hop</button>
      <button id="hop-2" class="active">2-hop</button>
    </div>
    <div id="immersive-search">
      <input type="text" id="imm-search-input" placeholder="Search nodes…" autocomplete="off" />
      <div id="imm-search-results"></div>
    </div>
    <div id="node-panel"></div>
  </div>
</div>
<script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<script>
window.GRAPH_CONFIG = {
  agent: 'Isotopy',
  agentPossessive: "Isotopy's",
  dataFile: 'graph-data.json',
  selfPronoun: 'I',
  defaultNode: 'agentworld-bratton-2026',
  exampleSearch: 'harness-centric intelligence',
  exampleBrief: 'harness-centric-intelligence',
  exampleSubgraph: 'agentworld-bratton-2026',
  exampleSurprise: 'agentworld-bratton-2026',
  examplePath: ['harness-centric-intelligence', 'basin-key'],
  exampleJaccard: 'harness-centric-intelligence',
  shortLabel: null,
  // External links come from each node's source_url in graph-data.json.
};
</script>
<script src="explore-core.js"></script>
</body>
</html>
